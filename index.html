<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PitchFlow — 팝송 영어 1000</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hd">
  <div class="hd-top">
    <div class="hd-logo">☕ NYC</div>
    <div class="hd-titles">
      <div class="hd-title">PitchFlow</div>
      <div class="hd-sub">팝송 영어 1000 · 뉴욕물먹은 보름달</div>
    </div>
    <div class="hd-badge" id="totalBadge">0 / 1000</div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div class="tabs">
    <div class="tab on" onclick="setTab('list')">🎵 목록</div>
    <div class="tab" onclick="setTab('card')">🃏 카드</div>
    <div class="tab" onclick="setTab('blank')">✏️ 빈칸</div>
    <div class="tab" onclick="setTab('fav')">⭐ 즐겨찾기</div>
  </div>
</div>

<!-- 목록 뷰 -->
<div id="viewList">
  <div class="search-wrap">
    <input class="search-input" id="searchInput" placeholder="🔍 곡명 · 아티스트 · 가사 검색..." oninput="onSearch(this.value)">
    <span class="search-clear" id="searchClear" onclick="clearSearch()">✕</span>
  </div>
  <div class="cat-row" id="catRow">
    <span class="cat-chip on" onclick="setCat(-1,this)">전체</span>
    <span class="cat-chip" onclick="setCat(0,this)">①긍정·희망</span>
    <span class="cat-chip" onclick="setCat(1,this)">②사랑·감성</span>
    <span class="cat-chip" onclick="setCat(2,this)">③위로·치유</span>
    <span class="cat-chip" onclick="setCat(3,this)">④철학·인생</span>
    <span class="cat-chip" onclick="setCat(4,this)">⑤올드팝</span>
    <span class="cat-chip" onclick="setCat(5,this)">⑥인디·트렌드</span>
    <span class="cat-chip" onclick="setCat(6,this)">⑦OST</span>
    <span class="cat-chip" onclick="setCat(7,this)">⑧R&amp;B</span>
    <span class="cat-chip" onclick="setCat(8,this)">⑨어쿠스틱</span>
    <span class="cat-chip" onclick="setCat(9,this)">⑩글로벌</span>
    <span class="cat-chip" onclick="setCat('star',this)">⭐즐겨찾기</span>
    <span class="cat-chip" onclick="setCat('done',this)">✅암기완료</span>
  </div>
  <div class="list-wrap">
    <div class="list-info" id="listInfo"></div>
    <div id="listContainer"></div>
  </div>
</div>

<!-- 카드 뷰 -->
<div id="viewCard" style="display:none">
  <div class="card-wrap">
    <div class="card-info" id="cardInfo">1 / 1000</div>
    <div class="shuffle-row">
      <span class="shuf-btn" onclick="shuffleCards()">🔀 섞기</span>
      <span class="shuf-btn" onclick="resetCards()">🔄 순서대로</span>
    </div>
    <div class="card-box" onclick="flipCard()">
      <div class="card-stripe"></div>
      <div class="card-inner">
        <div class="card-label">탭하면 번역이 나와요</div>
        <div class="card-num" id="cNum">#0001</div>
        <div class="card-title" id="cTitle">Title</div>
        <div class="card-artist" id="cArtist">Artist</div>
        <div class="card-en" id="cEn"></div>
        <div class="card-phonetic" id="cPhonetic"></div>
        <div class="card-ko" id="cKo"></div>
        <div class="card-key" id="cKey"></div>
        <div class="card-hint" id="cHint">▼ 탭해서 한국어 확인</div>
      </div>
    </div>
    <div class="card-controls">
      <div class="c-btn" onclick="prevCard()">◀ 이전</div>
      <div class="c-btn primary" onclick="nextCard()">다음 ▶</div>
    </div>
    <div class="card-controls">
      <div class="c-btn" id="cSpeak" onclick="speakCard()">🔊 듣기</div>
      <div class="c-btn" id="cStar" onclick="toggleCardStar()">☆ 즐겨찾기</div>
      <div class="c-btn" id="cDone" onclick="toggleCardDone()">○ 암기완료</div>
    </div>
  </div>
</div>

<!-- 빈칸 뷰 -->
<div id="viewBlank" style="display:none">
  <div class="blank-wrap">
    <div class="cat-row">
      <span class="cat-chip on" onclick="setBlankCat('all',this)">전체</span>
      <span class="cat-chip" onclick="setBlankCat('star',this)">⭐즐겨찾기</span>
      <span class="cat-chip" onclick="setBlankCat('todo',this)">미암기</span>
    </div>
    <div id="blankContainer"></div>
  </div>
</div>

<!-- 즐겨찾기 -->
<div id="viewFav" style="display:none">
  <div class="list-wrap" style="padding-top:16px">
    <div class="list-info" id="favInfo"></div>
    <div id="favContainer"></div>
  </div>
</div>

<!-- 스크롤 버튼 -->
<div class="scroll-btns">
  <div class="scroll-btn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</div>
  <div class="scroll-btn" onclick="window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})">↓</div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
